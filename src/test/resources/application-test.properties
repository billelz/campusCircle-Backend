# Test Profile Configuration
# Note: spring.profiles.active should NOT be set here - it's activated via @ActiveProfiles annotation

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable MongoDB for JPA unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# JWT Test Configuration (matching main app property keys)
jwt.secret=testSecretKeyForJWTtestSecretKeyForJWTtestSecretKeyForJWT
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# AI Moderation (disabled for tests)
ai.moderation.huggingface.api-key=test-api-key-not-used

# Logging
logging.level.org.springframework=WARN
logging.level.com.example.campusCircle=DEBUG
